name: Build APK
on:
  push:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Unzip the uploaded source
        run: |
          if [ ! -f settings.gradle.kts ]; then
            Z=$(ls *.zip | head -1)
            echo "Unzipping $Z"
            unzip -q -o "$Z" -d src_unzipped
            D=$(dirname "$(find src_unzipped -name settings.gradle.kts | head -1)")
            cp -r "$D"/. .
          fi
          ls -la
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"
      - name: Build the app
        run: gradle assembleDebug --no-daemon --stacktrace
      - name: Name the APK
        run: cp app/build/outputs/apk/debug/app-debug.apk KoboTestAgent.apk
      - uses: actions/upload-artifact@v4
        with:
          name: KoboTestAgent-apk
          path: KoboTestAgent.apk
      - name: Publish as a release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: Kobo Test Agent build ${{ github.run_number }}
          files: KoboTestAgent.apk
          make_latest: true
